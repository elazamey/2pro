name: "2pro Label Sync"
description: "Keep issue & PR labels in sync across a repository using a declarative labels config file"
author: "2pro"

branding:
  icon: "tag"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token (default: ${{ github.token }})"
    required: false
    default: ${{ github.token }}
  config-path:
    description: "Path to a JSON/YAML labels config file in the repo (default: .github/labels.json)"
    required: false
    default: ".github/labels.json"
  repo:
    description: "Target repo in owner/repo form (default: current repo)"
    required: false
    default: ${{ github.repository }}
  dry-run:
    description: "Set to 'true' to only print planned changes without applying them"
    required: false
    default: "false"
  prune:
    description: "Set to 'false' to avoid deleting labels not listed in the config"
    required: false
    default: "true"

runs:
  using: "node20"
  main: "dist/index.js"
