[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "twopro"
version = "0.1.0"
description = "2pro - a batteries-included GitHub toolkit: typed Python SDK, CLI, live dashboard and CI automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "elazamey" }]
keywords = ["github", "cli", "api", "sdk", "actions", "ci", "dashboard", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.5,<3",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "build>=1.2",
]

[project.scripts]
"2pro" = "twopro.cli.main:app"

[project.urls]
Homepage = "https://github.com/elazamey/2pro"
Repository = "https://github.com/elazamey/2pro"
Issues = "https://github.com/elazamey/2pro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/twopro"]

[tool.hatch.build.targets.sdist]
include = ["src/twopro", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["twopro"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.format]
quote-style = "double"
