<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2pro · GitHub control room</title>
<link rel="stylesheet" href="/static/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="bolt">⚡</span> 2pro <span class="tag">GitHub control room</span></div>
  <div class="topbar-right">
    <div id="ratelimit" class="ratelimit" title="GitHub API budget">
      <div class="rl-bar"><span id="rl-fill"></span></div>
      <span id="rl-text">…</span>
    </div>
    <div id="userchip" class="userchip">…</div>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <input id="repo-search" class="input" type="search" placeholder="Search repositories…" autocomplete="off" />
    </div>
    <div id="repo-list" class="repo-list">
      <div class="empty">Loading repositories…</div>
    </div>
    <div class="side-foot">
      <label class="check"><input type="checkbox" id="auto-refresh" /> auto-refresh (30s)</label>
      <div class="hint">Token stays on the server.</div>
    </div>
  </aside>

  <section class="content">
    <div id="banner" class="banner hidden"></div>

    <div class="repo-header">
      <div>
        <h1 id="repo-title">Select a repository</h1>
        <div id="repo-sub" class="muted"></div>
      </div>
      <div class="repo-actions">
        <button class="btn" id="btn-refresh" title="Reload">↻ Refresh</button>
        <a class="btn" id="btn-github" target="_blank" rel="noopener" hidden>Open on GitHub ↗</a>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="issues">Issues</button>
      <button class="tab" data-tab="pulls">Pull requests</button>
      <button class="tab" data-tab="actions">Actions</button>
      <button class="tab" data-tab="digest">Digest</button>
    </nav>

    <div id="panes">
      <div class="pane active" data-pane="overview">
        <div id="overview" class="cards"></div>
      </div>

      <div class="pane" data-pane="issues">
        <div class="toolbar">
          <select id="issue-state" class="input">
            <option value="open">Open</option>
            <option value="closed">Closed</option>
            <option value="all">All</option>
          </select>
          <button class="btn primary" id="btn-new-issue">＋ New issue</button>
        </div>
        <div id="issues" class="list"></div>
      </div>

      <div class="pane" data-pane="pulls">
        <div class="toolbar">
          <select id="pr-state" class="input">
            <option value="open">Open</option>
            <option value="closed">Closed</option>
            <option value="all">All</option>
          </select>
        </div>
        <div id="pulls" class="list"></div>
      </div>

      <div class="pane" data-pane="actions">
        <div class="toolbar">
          <select id="run-status" class="input">
            <option value="">All statuses</option>
            <option value="in_progress">In progress</option>
            <option value="queued">Queued</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div id="runs" class="list"></div>
      </div>

      <div class="pane" data-pane="digest">
        <div class="toolbar">
          <select id="digest-days" class="input">
            <option value="1">Last 24 hours</option>
            <option value="7" selected>Last 7 days</option>
            <option value="30">Last 30 days</option>
          </select>
          <button class="btn" id="btn-digest">Generate</button>
        </div>
        <div id="digest" class="markdown"></div>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modal-title">Title</h2>
      <button class="btn ghost" id="modal-close">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-ok">Submit</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
